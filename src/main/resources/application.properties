# Nazwa aplikacji
spring.application.name=ZIIBD_Project

# Konfiguracja bazy H2 w pami?ci
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Dialekt Hibernate dla H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatyczne tworzenie struktury bazy na podstawie encji JPA
spring.jpa.hibernate.ddl-auto=update

# W??czenie konsoli H2 (dost?pnej pod adresem http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
spring.h2.console.path=/h2-console